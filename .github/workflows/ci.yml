# RELEASE PATH -- read this before changing the `uses:` below.
#
# This repo does not publish anything itself. Its release pipeline is
# edapack/edapack-common's reusable build-release workflow, and the gating lives
# there: a `gate` job resolves the release-authority switch at
# https://dvkit.org/.well-known/release-authority.json and the publish job
# requires both `authority == 'github'` and an event that is not a push. That
# last clause is what makes this repo safe to mirror -- since 2026-08-31 its
# history moves between Forgejo and GitHub on a five-minute cron, and git-sync
# produces exactly one kind of event, a push.
#
# THE PIN IS NOT IMMUTABLE. `@v1` is an actions/checkout@v4-style major-version
# alias that edapack-common retargets forward, so it currently points at the tip
# of that repo's `main`. Changing it -- or edapack-common moving it -- changes
# this repo's release behaviour with no commit here.
#
# This block is also load-bearing for the sync itself, which is worth knowing
# before deleting it as boilerplate. git-sync's inbound publish preflight reads
# workflow files as TEXT and cannot follow a `uses:` into another repository, so
# it sees a reference to a release pipeline and no evidence of a gate, and
# refuses to pull the ref. Naming the switch here is how this file states the
# thing the scanner is actually asking about; the gate really is on, it is just
# one repository away. There is a counterpart check in
# .forgejo/workflows/ci.yml that asserts the pin still resolves.

name: CI
# Thin caller of the shared edapack build pipeline, for Verilator Labs. All
# build/release logic (resolve inputs -> change-gate -> build matrix -> publish,
# with a release manifest) lives in edapack-common. Input components are
# declared in build-inputs.yaml. Derived from edapack/verilator-bin's ci.yml
# with its `dev` job removed.
#
# One track, `release`: a full release that moves `latest`. It is started only
# by .github/workflows/release-tag.yml, which a push of a release tag
# (v<ver>-labs.<YYYY>.<NN>[.<n>]) runs: it checks the tag with
# `labs.py check-release` and dispatches this workflow at the tag with
# core_ref=<source tag> (and revision/revision_note for a packaging re-spin).
# The release version, and so the release tag, is the core_ref tag name. See
# docs/design/labs-release.md (How the release tag starts a release).
#
# workflow_dispatch only: no cron (labs releases are cut by hand) and no push
# (build-release.yml never publishes on a push anyway, mirror safety).
#
# Windows (windows-x86_64, MSYS2 UCRT64) is `optional`: a failure there is
# reported but never blocks a release.
on:
  workflow_dispatch:
    inputs:
      core_ref:
        description: "Labs source tag on mballance/verilator, e.g. v5.051-labs.2026.02"
        type: string
        required: true
      revision:
        description: "Packaging re-spin number (empty for the first release of core_ref)"
        type: string
        default: ""
      revision_note:
        description: "Re-spin only: what changed in the package, for the release body"
        type: string
        default: ""
      input_overrides:
        description: 'JSON map of dependency overrides, e.g. {"bitwuzla":"0.6.0"}'
        type: string
        default: "{}"
      force:
        description: "Build even if inputs are unchanged"
        type: boolean
        default: false

jobs:
  release:
    uses: edapack/edapack-common/.github/workflows/build-release.yml@v1
    with:
      package: verilator-labs-bin
      track: release
      targets: |
        [
          {"name":"manylinux_2_28_x86_64","runs-on":"ubuntu-latest","kind":"docker","image":"quay.io/pypa/manylinux_2_28_x86_64"},
          {"name":"manylinux_2_34_x86_64","runs-on":"ubuntu-latest","kind":"docker","image":"quay.io/pypa/manylinux_2_34_x86_64"},
          {"name":"manylinux2014_x86_64","runs-on":"ubuntu-latest","kind":"docker","image":"quay.io/pypa/manylinux2014_x86_64"},
          {"name":"manylinux_2_28_aarch64","runs-on":"ubuntu-24.04-arm","kind":"docker","image":"quay.io/pypa/manylinux_2_28_aarch64"},
          {"name":"manylinux_2_34_aarch64","runs-on":"ubuntu-24.04-arm","kind":"docker","image":"quay.io/pypa/manylinux_2_34_aarch64"},
          {"name":"macos-arm64","runs-on":"macos-15","kind":"native"},
          {"name":"windows-x86_64","runs-on":"windows-latest","kind":"msys2","msystem":"UCRT64","optional":true}
        ]
      core_ref: ${{ inputs.core_ref }}
      revision: ${{ inputs.revision }}
      revision_note: ${{ inputs.revision_note }}
      input_overrides: ${{ inputs.input_overrides || '{}' }}
      force: ${{ inputs.force }}
